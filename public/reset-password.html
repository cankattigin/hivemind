<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hivemind — Şifre Sıfırla</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--border:#2e3354;--border2:#3d4470;--text:#e8eaf6;--text2:#9fa8c7;--text3:#5c6490;--accent:#6366f1;--accent2:#818cf8;--accent-bg:#1e1f3a;--red:#ef4444;--red-bg:#2a1010;--green:#10b981;--green-bg:#0d2a1f;--radius:8px;--radius-lg:12px;--radius-xl:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px}
.card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:40px;width:400px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{font-size:13px;color:var(--text3);margin-top:4px}
h2{font-size:18px;font-weight:700;margin-bottom:6px}
.sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}
.form-hint{font-size:11px;color:var(--text3);margin-top:4px}
input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:8px 12px;font-size:13px;font-family:inherit;width:100%;outline:none;transition:border .15s}
input:focus{border-color:var(--accent)}
.btn{padding:10px 14px;border-radius:var(--radius);border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:600;width:100%;margin-top:4px;transition:background .15s}
.btn:hover{background:#5558e8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:12px;font-size:13px;text-align:center;padding:10px;border-radius:var(--radius)}
.msg.error{background:var(--red-bg);color:var(--red);border:1px solid #3a1010}
.msg.success{background:var(--green-bg);color:var(--green);border:1px solid #0d3a2a}
.back{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--text3);text-decoration:none}
.back:hover{color:var(--text2)}
.strength{height:3px;border-radius:2px;margin-top:6px;background:var(--bg3);transition:all .3s}
.strength-bar{height:100%;border-radius:2px;transition:width .3s, background .3s}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><h1>🧠 Hivemind</h1><p>Game Production Platform</p></div>
  <div id="form-view">
    <h2>Şifre Sıfırla</h2>
    <p class="sub">Yeni şifrenizi girin. Şifre en az 8 karakter olmalı ve büyük harf, küçük harf ve rakam içermelidir.</p>
    <div class="form-group">
      <label class="form-label">Yeni Şifre</label>
      <input id="pw" type="password" placeholder="Yeni şifreniz" oninput="checkStrength()">
      <div class="strength"><div class="strength-bar" id="sbar"></div></div>
    </div>
    <div class="form-group">
      <label class="form-label">Şifre Tekrar</label>
      <input id="pw2" type="password" placeholder="Şifrenizi tekrar girin" onkeydown="if(event.key==='Enter')submit()">
    </div>
    <button class="btn" id="btn" onclick="submit()">Şifremi Güncelle</button>
    <div id="msg"></div>
  </div>
  <div id="done-view" style="display:none;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">✅</div>
    <h2>Şifreniz Güncellendi</h2>
    <p class="sub" style="margin-top:8px">Yeni şifrenizle giriş yapabilirsiniz.</p>
    <a href="/" class="btn" style="display:block;text-decoration:none;text-align:center;margin-top:20px">Giriş Sayfasına Git</a>
  </div>
  <a href="/" class="back">← Giriş sayfasına dön</a>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) showMsg('Geçersiz bağlantı. Lütfen e-postanızdaki bağlantıyı kullanın.', 'error');

function checkStrength() {
  const pw = document.getElementById('pw').value;
  const checks = [pw.length >= 8, /[A-Z]/.test(pw), /[a-z]/.test(pw), /[0-9]/.test(pw)];
  const score = checks.filter(Boolean).length;
  const bar = document.getElementById('sbar');
  const colors = ['', '#ef4444', '#f59e0b', '#f59e0b', '#10b981'];
  bar.style.width = (score * 25) + '%';
  bar.style.background = colors[score] || '';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + type;
  el.textContent = text;
}

async function submit() {
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (!pw) return showMsg('Şifre boş olamaz.', 'error');
  if (pw !== pw2) return showMsg('Şifreler eşleşmiyor.', 'error');
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Güncelleniyor...';
  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw })
    });
    const data = await r.json();
    if (!r.ok) {
      showMsg(data.error || 'Bir hata oluştu.', 'error');
      btn.disabled = false;
      btn.textContent = 'Şifremi Güncelle';
    } else {
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('done-view').style.display = 'block';
    }
  } catch {
    showMsg('Bağlantı hatası. Lütfen tekrar deneyin.', 'error');
    btn.disabled = false;
    btn.textContent = 'Şifremi Güncelle';
  }
}
</script>
</body>
</html>
